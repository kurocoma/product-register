quality_axes:
  correctness:
    weight: 30
    description: "ユーザー依頼(管理番号リスト→Yahoo安全移行)と acceptance を正しく満たすか。per-item結果/summary/dry-run/安全既定が仕様通りか"
  regression_safety:
    weight: 20
    description: "既存の単品ルート・既存テスト・公開挙動・後方互換を壊していないか。関数抽出が既存外部挙動を不変に保つか"
  test_quality:
    weight: 15
    description: "意味のある単体テストが追加/維持されているか(リスト/CSVパース,失敗継続,カテゴリnull,多SKUスキップ,安全既定の検証)。テストの緩和が無いか"
  maintainability:
    weight: 15
    description: "変更が読みやすく局所的で将来保守しやすいか。pure ロジックと I/O 境界が分離され、ファイルが過大でないか"
  integration_fit:
    weight: 10
    description: "既存設計(csv/bulk の I/F規約・命名・supabase認証・recordHistory・converter再利用)に整合しているか"
  risk_control:
    weight: 10
    description: "安全状態既定/レート制御/失敗継続/カテゴリ・多SKUの誤登録防止/秘密情報非露出 が適切か"

threshold: 90

scoring_rules:
  - "score と quality.overall は一致させる"
  - "hard gate 失敗時は passed=false(記録器が再計算する)。evidence と矛盾させない"
  - "前回比でなく絶対評価する"
  - "plan への忠実さでなく task と criteria への適合を評価する"
  - "作る係の report でなく、実物とコマンド結果を証拠にする"
  - "テストが通っていても設計・互換・保守・セキュリティに問題があれば減点する"
