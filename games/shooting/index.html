<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>コズミックストライカー</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    color: #cfe3ff;
    font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    height: 100%;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
  }
  canvas {
    background: #05060f;
    max-width: 100vw;
    max-height: 96vh;
    aspect-ratio: 480 / 720;
    touch-action: none;
    border: 1px solid #1b2445;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(40, 90, 255, .25);
  }
  #hint {
    font-size: 12px;
    color: #5b6f9e;
    text-align: center;
    padding-bottom: 4px;
  }
  @media (max-height: 780px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hint">移動: ←→↑↓ / WASD ・ ショット: スペース（押しっぱなしOK）・ ポーズ: Esc ・ サウンド: M ・ スマホはドラッグで移動＆自動ショット</div>
</div>
<script>
'use strict';

// ===== 基本セットアップ =====
const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ===== サウンド（WebAudio 簡易シンセ） =====
let audioCtx = null;
let muted = localStorage.getItem('cosmicMuted') === '1';

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* 未対応環境は無音 */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type, vol, slideTo) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur);
}

function noise(dur, vol) {
  if (muted || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(g).connect(audioCtx.destination);
  src.start(t0);
}

const sfx = {
  shot()      { tone(900, 0.06, 'square', 0.025, 300); },
  hit()       { tone(220, 0.08, 'sawtooth', 0.04, 60); },
  explode()   { noise(0.3, 0.12); tone(110, 0.25, 'sawtooth', 0.06, 30); },
  bigBoom()   { noise(0.6, 0.2); tone(70, 0.5, 'sawtooth', 0.1, 20); },
  playerHit() { noise(0.4, 0.18); tone(160, 0.35, 'square', 0.08, 40); },
  power()     { tone(523, 0.08, 'square', 0.05); setTimeout(() => tone(784, 0.08, 'square', 0.05), 70); setTimeout(() => tone(1046, 0.12, 'square', 0.05), 140); },
  start()     { tone(440, 0.1, 'square', 0.05); setTimeout(() => tone(660, 0.1, 'square', 0.05), 90); setTimeout(() => tone(880, 0.15, 'square', 0.05), 180); },
};

// ===== 入力 =====
const keys = new Set();
let pointerActive = false, pointerX = W / 2, pointerY = H - 120;

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  keys.add(e.code);
  ensureAudio();
  if (e.code === 'KeyM') {
    muted = !muted;
    localStorage.setItem('cosmicMuted', muted ? '1' : '0');
  }
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') paused = !paused;
  if (e.code === 'Space' || e.code === 'Enter') handleStart();
});
window.addEventListener('keyup', (e) => keys.delete(e.code));

function toGameCoords(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) * W / r.width, y: (clientY - r.top) * H / r.height };
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  ensureAudio();
  const p = toGameCoords(e.clientX, e.clientY);
  pointerActive = true;
  pointerX = p.x; pointerY = p.y;
  handleStart();
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;
  const p = toGameCoords(e.clientX, e.clientY);
  pointerX = p.x; pointerY = p.y;
});
window.addEventListener('pointerup', () => { pointerActive = false; });
window.addEventListener('pointercancel', () => { pointerActive = false; });

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') paused = true;
});

// ===== ゲーム状態 =====
let state = 'title'; // title | play | over
let paused = false;
let score = 0;
let hiScore = parseInt(localStorage.getItem('cosmicHiScore') || '0', 10);
let newRecord = false;
let overTimer = 0;

let player = null;
let playerBullets = [], enemyBullets = [], enemies = [], powerups = [], particles = [];
let boss = null;
let wave = 0, waveTime = 0, spawnQueue = [];
let betweenWaves = false, waveClearTimer = 0, waveAnnounceT = 0;
let shake = 0;
let frameT = 0; // 演出用の通し時間

// 星空（3層パララックス）
const stars = [];
for (let i = 0; i < 90; i++) {
  const layer = i % 3;
  stars.push({ x: rand(0, W), y: rand(0, H), speed: 20 + layer * 35, size: 0.6 + layer * 0.7, layer });
}

function resetGame() {
  score = 0;
  newRecord = false;
  player = {
    x: W / 2, y: H - 100, r: 10,
    speed: 320,
    lives: 3,
    weapon: 1,
    shield: false,
    fireT: 0,
    invuln: 2,
  };
  playerBullets = [];
  enemyBullets = [];
  enemies = [];
  powerups = [];
  particles = [];
  boss = null;
  wave = 0;
  spawnQueue = [];
  betweenWaves = true;
  waveClearTimer = 1.0;
  shake = 0;
  paused = false;
}

function handleStart() {
  if (state === 'title') {
    resetGame();
    state = 'play';
    sfx.start();
  } else if (state === 'over' && overTimer > 1) {
    resetGame();
    state = 'play';
    sfx.start();
  }
}

// ===== ウェーブ生成 =====
function spawnWave(n) {
  wave = n;
  waveTime = 0;
  waveAnnounceT = 1.6;
  spawnQueue = [];
  if (n % 5 === 0) { // 5の倍数ウェーブはボス
    spawnQueue.push({ t: 1.2, type: 'boss', x: W / 2 });
    return;
  }
  const count = Math.min(6 + n * 2, 24);
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    let type = 'drone';
    if (n >= 4 && r < 0.12) type = 'tank';
    else if (n >= 3 && r < 0.36) type = 'shooter';
    else if (n >= 2 && r < 0.62) type = 'zig';
    spawnQueue.push({ t: 0.4 + i * 0.5, type, x: rand(40, W - 40) });
  }
}

function makeEnemy(type, x) {
  const s = 1 + (wave - 1) * 0.05; // ウェーブによる速度スケール
  const base = { type, x, baseX: x, y: -30, t: 0, fireT: rand(0.8, 1.8), dead: false };
  switch (type) {
    case 'drone':   return Object.assign(base, { hp: 1,  r: 12, vy: 95 * s,  amp: rand(20, 45), score: 100 });
    case 'zig':     return Object.assign(base, { hp: 2,  r: 12, vy: 115 * s, vx: (Math.random() < 0.5 ? -1 : 1) * 130, score: 150 });
    case 'shooter': return Object.assign(base, { hp: 3,  r: 14, vy: 75 * s,  stopY: rand(110, 240), hold: 0, score: 250 });
    case 'tank':    return Object.assign(base, { hp: 9 + wave, r: 19, vy: 48 * s, score: 450 });
    case 'boss': {
      const hp = 140 + wave * 32;
      return Object.assign(base, { hp, maxHp: hp, r: 44, targetY: 120, fireT: 1.2, burstT: 2.2, burstA: 0, score: 5000 + wave * 500 });
    }
  }
}

function enemyBulletSpeed() { return Math.min(150 + wave * 8, 270); }

function fireAimed(e, speed, spreadAngle, big) {
  const a = Math.atan2(player.y - e.y, player.x - e.x) + (spreadAngle || 0);
  enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: big ? 6 : 4 });
}

// ===== エフェクト =====
function explosion(x, y, color, n, spread) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(30, spread || 220);
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.8), maxLife: 0.8,
      color, size: rand(1.5, 4),
    });
  }
}

function dropPowerup(x, y) {
  const r = Math.random();
  let kind = null;
  if (r < 0.08) kind = 'P';
  else if (r < 0.13) kind = 'S';
  else if (r < 0.155) kind = 'L';
  if (kind) powerups.push({ x, y, kind, t: 0 });
}

// ===== 更新処理 =====
function hitPlayer() {
  if (player.invuln > 0) return;
  if (player.shield) {
    player.shield = false;
    player.invuln = 1.2;
    explosion(player.x, player.y, '#4fd8ff', 20, 160);
    sfx.hit();
    return;
  }
  player.lives--;
  player.weapon = Math.max(1, player.weapon - 1);
  explosion(player.x, player.y, '#7fc4ff', 40, 260);
  shake = 12;
  sfx.playerHit();
  if (player.lives < 0) {
    state = 'over';
    overTimer = 0;
    if (score > hiScore) {
      hiScore = score;
      newRecord = true;
      localStorage.setItem('cosmicHiScore', String(hiScore));
    }
    sfx.bigBoom();
  } else {
    player.x = W / 2;
    player.y = H - 100;
    player.invuln = 2.5;
  }
}

function updatePlayer(dt) {
  player.fireT -= dt;
  player.invuln -= dt;

  // キーボード移動
  let dx = 0, dy = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) dx -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) dx += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) dy -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) dy += 1;
  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    player.x += dx / len * player.speed * dt;
    player.y += dy / len * player.speed * dt;
  }

  // ポインタ（タッチ/マウスドラッグ）追従
  if (pointerActive) {
    const tx = pointerX, ty = pointerY - 70;
    player.x += (tx - player.x) * Math.min(1, dt * 14);
    player.y += (ty - player.y) * Math.min(1, dt * 14);
  }

  player.x = clamp(player.x, 16, W - 16);
  player.y = clamp(player.y, 60, H - 24);

  // ショット
  const firing = keys.has('Space') || pointerActive;
  if (firing && player.fireT <= 0) {
    player.fireT = player.weapon >= 4 ? 0.11 : 0.14;
    const pb = (offX, angle) => {
      playerBullets.push({
        x: player.x + offX, y: player.y - 16,
        vx: Math.sin(angle) * 560, vy: -Math.cos(angle) * 560, r: 4,
      });
    };
    if (player.weapon === 1) { pb(0, 0); }
    else if (player.weapon === 2) { pb(-7, 0); pb(7, 0); }
    else if (player.weapon === 3) { pb(0, 0); pb(-10, -0.16); pb(10, 0.16); }
    else { pb(0, 0); pb(-8, -0.12); pb(8, 0.12); pb(-14, -0.28); pb(14, 0.28); }
    sfx.shot();
  }
}

function updateEnemy(e, dt) {
  e.t += dt;
  switch (e.type) {
    case 'drone':
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * 3) * e.amp;
      break;
    case 'zig':
      e.y += e.vy * dt;
      e.x += e.vx * dt;
      if (e.x < 20 || e.x > W - 20) { e.vx *= -1; e.x = clamp(e.x, 20, W - 20); }
      e.fireT -= dt;
      if (wave >= 5 && e.fireT <= 0 && e.y > 0 && e.y < H - 200) {
        e.fireT = rand(2.2, 3.5);
        enemyBullets.push({ x: e.x, y: e.y + 10, vx: 0, vy: enemyBulletSpeed(), r: 4 });
      }
      break;
    case 'shooter':
      if (e.y < e.stopY) {
        e.y += e.vy * dt;
      } else {
        e.hold += dt;
        e.x = e.baseX + Math.sin(e.t * 1.5) * 30;
        e.fireT -= dt;
        if (e.fireT <= 0 && e.y > 0) {
          e.fireT = Math.max(1.0, 1.8 - wave * 0.06);
          fireAimed(e, enemyBulletSpeed());
          sfx.hit();
        }
        if (e.hold > 8) e.stopY = H + 100; // 一定時間で離脱
      }
      break;
    case 'tank':
      e.y += e.vy * dt;
      e.fireT -= dt;
      if (wave >= 6 && e.fireT <= 0 && e.y > 0 && e.y < H - 250) {
        e.fireT = rand(2.5, 3.5);
        fireAimed(e, enemyBulletSpeed() * 0.8, -0.2, true);
        fireAimed(e, enemyBulletSpeed() * 0.8, 0.2, true);
      }
      break;
    case 'boss': {
      const enraged = e.hp < e.maxHp * 0.4;
      const rate = enraged ? 0.62 : 1;
      if (e.y < e.targetY) {
        e.y += 60 * dt;
      } else {
        e.x = W / 2 + Math.sin(e.t * 0.7) * (W / 2 - 90);
        e.fireT -= dt;
        if (e.fireT <= 0) {
          e.fireT = 0.95 * rate;
          fireAimed(e, enemyBulletSpeed() + 30, -0.18);
          fireAimed(e, enemyBulletSpeed() + 30, 0);
          fireAimed(e, enemyBulletSpeed() + 30, 0.18);
          sfx.hit();
        }
        e.burstT -= dt;
        if (e.burstT <= 0) {
          e.burstT = 2.6 * rate;
          e.burstA += 0.35;
          const num = enraged ? 22 : 16;
          for (let i = 0; i < num; i++) {
            const a = e.burstA + i * TAU / num;
            enemyBullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, r: 5 });
          }
          sfx.explode();
        }
      }
      break;
    }
  }
  if (e.y > H + 50) e.dead = true; // 画面外へ退場
}

function killEnemy(e) {
  e.dead = true;
  score += e.score;
  if (e.type === 'boss') {
    boss = null;
    explosion(e.x, e.y, '#ffb04f', 80, 340);
    explosion(e.x, e.y, '#ff5f4f', 60, 300);
    shake = 18;
    sfx.bigBoom();
    enemyBullets.length = 0; // ボス撃破で弾消し
  } else {
    explosion(e.x, e.y, e.type === 'tank' ? '#9fdc6c' : '#ff9f5f', 22, 200);
    dropPowerup(e.x, e.y);
    sfx.explode();
  }
}

function update(dt) {
  frameT += dt;

  // 星空は常に流す
  for (const s of stars) {
    s.y += s.speed * (state === 'play' ? 1 : 0.4) * dt;
    if (s.y > H) { s.y -= H; s.x = rand(0, W); }
  }

  if (state !== 'play') {
    if (state === 'over') overTimer += dt;
    // タイトル/ゲームオーバーでも残った演出は流す
    updateParticles(dt);
    return;
  }
  if (paused) return;

  shake = Math.max(0, shake - dt * 30);
  if (waveAnnounceT > 0) waveAnnounceT -= dt;

  updatePlayer(dt);

  // ウェーブ進行
  waveTime += dt;
  while (spawnQueue.length && spawnQueue[0].t <= waveTime) {
    const sp = spawnQueue.shift();
    const e = makeEnemy(sp.type, sp.x);
    enemies.push(e);
    if (sp.type === 'boss') boss = e;
  }
  if (!betweenWaves && spawnQueue.length === 0 && enemies.length === 0) {
    betweenWaves = true;
    waveClearTimer = 1.8;
  }
  if (betweenWaves) {
    waveClearTimer -= dt;
    if (waveClearTimer <= 0) {
      betweenWaves = false;
      spawnWave(wave + 1);
    }
  }

  // 弾の移動
  for (const b of playerBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  playerBullets = playerBullets.filter((b) => b.y > -20 && b.x > -20 && b.x < W + 20);
  for (const b of enemyBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  enemyBullets = enemyBullets.filter((b) => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // 敵の更新
  for (const e of enemies) updateEnemy(e, dt);

  // 自弾 vs 敵
  for (const b of playerBullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      const rr = e.r + b.r;
      const ddx = e.x - b.x, ddy = e.y - b.y;
      if (ddx * ddx + ddy * ddy < rr * rr) {
        b.dead = true;
        e.hp--;
        e.flash = 0.06;
        particles.push({ x: b.x, y: b.y, vx: rand(-40, 40), vy: rand(-80, -20), life: 0.2, maxLife: 0.2, color: '#bfe9ff', size: 2 });
        if (e.hp <= 0) killEnemy(e);
        else sfx.hit();
        break;
      }
    }
  }
  playerBullets = playerBullets.filter((b) => !b.dead);

  // 敵弾 vs 自機
  for (const b of enemyBullets) {
    const rr = player.r + b.r;
    const ddx = player.x - b.x, ddy = player.y - b.y;
    if (ddx * ddx + ddy * ddy < rr * rr) {
      b.dead = true;
      hitPlayer();
      if (state !== 'play') return;
    }
  }
  enemyBullets = enemyBullets.filter((b) => !b.dead);

  // 敵本体 vs 自機
  for (const e of enemies) {
    if (e.dead) continue;
    const rr = player.r + e.r;
    const ddx = player.x - e.x, ddy = player.y - e.y;
    if (ddx * ddx + ddy * ddy < rr * rr) {
      if (player.invuln <= 0) {
        e.hp -= 3;
        if (e.hp <= 0) killEnemy(e);
        hitPlayer();
        if (state !== 'play') return;
      }
    }
  }
  enemies = enemies.filter((e) => !e.dead);

  // パワーアップ
  for (const p of powerups) {
    p.t += dt;
    p.y += 85 * dt;
    p.x += Math.sin(p.t * 3) * 20 * dt;
    const rr = player.r + 14;
    const ddx = player.x - p.x, ddy = player.y - p.y;
    if (ddx * ddx + ddy * ddy < rr * rr) {
      p.dead = true;
      sfx.power();
      if (p.kind === 'P') {
        if (player.weapon < 4) player.weapon++;
        else score += 500;
      } else if (p.kind === 'S') {
        player.shield = true;
      } else if (p.kind === 'L') {
        if (player.lives < 5) player.lives++;
        else score += 1000;
      }
    }
  }
  powerups = powerups.filter((p) => !p.dead && p.y < H + 30);

  updateParticles(dt);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 1 - dt * 2;
    p.vy *= 1 - dt * 2;
  }
  particles = particles.filter((p) => p.life > 0);
}

// ===== 描画処理 =====
function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.layer * 0.3;
    ctx.fillStyle = s.layer === 2 ? '#bcd7ff' : '#6f86c9';
    ctx.fillRect(s.x, s.y, s.size, s.size * 2.2);
  }
  ctx.globalAlpha = 1;
}

function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // エンジン噴射
  const flame = 10 + Math.random() * 8;
  ctx.fillStyle = 'rgba(255,170,60,0.9)';
  ctx.beginPath();
  ctx.moveTo(-4, 12);
  ctx.lineTo(0, 12 + flame);
  ctx.lineTo(4, 12);
  ctx.closePath();
  ctx.fill();
  // 機体
  ctx.shadowColor = '#57c9ff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#7fd4ff';
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(11, 9);
  ctx.lineTo(5, 13);
  ctx.lineTo(0, 8);
  ctx.lineTo(-5, 13);
  ctx.lineTo(-11, 9);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#eaf7ff';
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(4, 2);
  ctx.lineTo(-4, 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.flash > 0) { e.flash -= 1 / 60; ctx.globalAlpha = 0.6; }
  switch (e.type) {
    case 'drone':
      ctx.shadowColor = '#ff6f5f'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ff7a63';
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c93a2e';
      ctx.fillRect(-14, -3, 6, 6);
      ctx.fillRect(8, -3, 6, 6);
      break;
    case 'zig':
      ctx.shadowColor = '#ffd75f'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffd75f';
      ctx.beginPath();
      ctx.moveTo(0, -13); ctx.lineTo(11, 0); ctx.lineTo(0, 13); ctx.lineTo(-11, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a6a00';
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
      break;
    case 'shooter':
      ctx.shadowColor = '#c77fff'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#b76ff2';
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i * TAU / 6 + Math.PI / 6;
        const px = Math.cos(a) * 13, py = Math.sin(a) * 13;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f2e3ff';
      ctx.beginPath(); ctx.arc(0, 0, 5 + Math.sin(e.t * 6) * 1.5, 0, TAU); ctx.fill();
      break;
    case 'tank':
      ctx.shadowColor = '#9fdc6c'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#7cb84e';
      ctx.beginPath();
      ctx.moveTo(-18, -10); ctx.lineTo(18, -10); ctx.lineTo(14, 14); ctx.lineTo(-14, 14);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3f6323';
      ctx.fillRect(-10, -4, 20, 8);
      ctx.fillStyle = '#d7f2bd';
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
      break;
    case 'boss': {
      ctx.shadowColor = '#ff5f8f'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#d84f7c';
      ctx.beginPath();
      ctx.moveTo(-44, -6);
      ctx.quadraticCurveTo(0, -46, 44, -6);
      ctx.lineTo(30, 22);
      ctx.quadraticCurveTo(0, 40, -30, 22);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8f2247';
      ctx.fillRect(-34, 0, 14, 12);
      ctx.fillRect(20, 0, 14, 12);
      const core = 10 + Math.sin(e.t * 5) * 2.5;
      ctx.fillStyle = '#ffe08f';
      ctx.shadowColor = '#ffcf4f';
      ctx.beginPath(); ctx.arc(0, 6, core, 0, TAU); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = '#cfe3ff';
  ctx.font = 'bold 15px "Segoe UI", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + score, 12, 24);
  ctx.textAlign = 'right';
  ctx.fillText('HI ' + Math.max(hiScore, score), W - 12, 24);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7f96c9';
  ctx.fillText('WAVE ' + Math.max(wave, 1), W / 2, 24);

  // 残機
  for (let i = 0; i < player.lives; i++) {
    ctx.save();
    ctx.translate(20 + i * 20, 44);
    ctx.scale(0.55, 0.55);
    ctx.fillStyle = '#7fd4ff';
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(9, 9); ctx.lineTo(-9, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 武器レベル
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffd75f';
  ctx.fillText('POWER ' + player.weapon + '/4', W - 12, 48);

  // ボスHPバー
  if (boss && boss.y >= boss.targetY) {
    const w = W - 80, ratio = clamp(boss.hp / boss.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(40, 60, w, 8);
    ctx.fillStyle = ratio > 0.4 ? '#ff5f8f' : '#ffcf4f';
    ctx.fillRect(40, 60, w * ratio, 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.strokeRect(40, 60, w, 8);
  }
}

function drawCenteredText(lines) {
  ctx.textAlign = 'center';
  for (const [text, y, font, color] of lines) {
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  drawStars();

  if (state === 'play' || state === 'over') {
    // パワーアップ
    for (const p of powerups) {
      const colors = { P: '#ffd75f', S: '#4fd8ff', L: '#7fff8f' };
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.t * 4) * 0.3);
      ctx.shadowColor = colors[p.kind]; ctx.shadowBlur = 12;
      ctx.fillStyle = colors[p.kind];
      ctx.fillRect(-11, -11, 22, 22);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#05060f';
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.kind, 0, 1);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }

    for (const e of enemies) drawEnemy(e);

    // 自機（無敵中は点滅）
    if (state === 'play' && !(player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0)) {
      drawShip(player.x, player.y);
      if (player.shield) {
        ctx.strokeStyle = 'rgba(79,216,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 20 + Math.sin(frameT * 6) * 2, 0, TAU);
        ctx.stroke();
      }
    }

    // 弾（加算合成でグロー）
    ctx.globalCompositeOperation = 'lighter';
    for (const b of playerBullets) {
      ctx.fillStyle = '#8fe9ff';
      ctx.shadowColor = '#4fd8ff'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    for (const b of enemyBullets) {
      ctx.fillStyle = b.r > 4 ? '#ffcf6f' : '#ff8fb0';
      ctx.shadowColor = b.r > 4 ? '#ff9f2f' : '#ff4f7f'; ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 0;
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (state === 'play') {
      drawHUD();

      if (waveAnnounceT > 0 && wave > 0) {
        ctx.globalAlpha = clamp(waveAnnounceT, 0, 1);
        const isBoss = wave % 5 === 0;
        drawCenteredText([
          [isBoss ? 'WARNING !!' : 'WAVE ' + wave, H / 2 - 20, 'bold 36px "Segoe UI", sans-serif', isBoss ? '#ff5f6f' : '#cfe3ff'],
          [isBoss ? '巨大戦艦 接近中' : '', H / 2 + 16, '18px "Segoe UI", sans-serif', '#ff9fb0'],
        ]);
        ctx.globalAlpha = 1;
      }
      if (betweenWaves && wave > 0) {
        drawCenteredText([
          ['WAVE ' + wave + ' クリア !', H / 2 - 10, 'bold 28px "Segoe UI", sans-serif', '#7fff8f'],
        ]);
      }
      if (paused) {
        ctx.fillStyle = 'rgba(5,6,15,0.65)';
        ctx.fillRect(0, 0, W, H);
        drawCenteredText([
          ['ポーズ中', H / 2 - 10, 'bold 32px "Segoe UI", sans-serif', '#cfe3ff'],
          ['Esc または P で再開', H / 2 + 28, '16px "Segoe UI", sans-serif', '#7f96c9'],
        ]);
      }
    }
  }

  if (state === 'title') {
    const blink = Math.floor(frameT * 2) % 2 === 0;
    ctx.shadowColor = '#4f8fff'; ctx.shadowBlur = 24;
    drawCenteredText([
      ['COSMIC', 200, 'bold 58px "Segoe UI", sans-serif', '#7fd4ff'],
      ['STRIKER', 260, 'bold 58px "Segoe UI", sans-serif', '#7fd4ff'],
    ]);
    ctx.shadowBlur = 0;
    drawCenteredText([
      ['— コズミックストライカー —', 300, '16px "Segoe UI", sans-serif', '#7f96c9'],
      ['HI SCORE  ' + hiScore, 360, 'bold 18px "Segoe UI", sans-serif', '#ffd75f'],
      ['移動 : ←→↑↓ / WASD ・ ドラッグ', 430, '15px "Segoe UI", sans-serif', '#9fb4de'],
      ['ショット : スペース（タッチ中は自動）', 456, '15px "Segoe UI", sans-serif', '#9fb4de'],
      ['P=パワーアップ  S=シールド  L=残機', 482, '15px "Segoe UI", sans-serif', '#9fb4de'],
      ['5ウェーブごとにボス出現！', 508, '15px "Segoe UI", sans-serif', '#9fb4de'],
    ]);
    if (blink) {
      drawCenteredText([
        ['スペースキー / タップ でスタート', 580, 'bold 20px "Segoe UI", sans-serif', '#eaf7ff'],
      ]);
    }
    drawShip(W / 2, 640);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(5,6,15,0.55)';
    ctx.fillRect(0, 0, W, H);
    drawCenteredText([
      ['GAME OVER', H / 2 - 70, 'bold 48px "Segoe UI", sans-serif', '#ff5f6f'],
      ['SCORE  ' + score, H / 2 - 10, 'bold 26px "Segoe UI", sans-serif', '#cfe3ff'],
      ['HI SCORE  ' + hiScore, H / 2 + 26, '18px "Segoe UI", sans-serif', '#ffd75f'],
    ]);
    if (newRecord) {
      drawCenteredText([
        ['ハイスコア更新！', H / 2 + 62, 'bold 20px "Segoe UI", sans-serif', '#7fff8f'],
      ]);
    }
    if (overTimer > 1 && Math.floor(frameT * 2) % 2 === 0) {
      drawCenteredText([
        ['スペースキー / タップ でリトライ', H / 2 + 120, 'bold 18px "Segoe UI", sans-serif', '#eaf7ff'],
      ]);
    }
  }

  ctx.restore();

  // ミュート表示
  ctx.textAlign = 'right';
  ctx.font = '12px "Segoe UI", sans-serif';
  ctx.fillStyle = '#4a5a85';
  ctx.fillText(muted ? '🔇 M でサウンドON' : '🔊 M でサウンドOFF', W - 10, H - 10);
}

// ===== メインループ =====
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
